name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install tools
        uses: jdx/mise-action@v3

      - name: Run bashunit tests
        run: mise run test

      - name: Run ShellCheck
        run: mise run lint

      - name: Check shell formatting
        run: mise run format-check
