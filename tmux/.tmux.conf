bind-key r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Make mise-managed tools available to run-shell commands (e.g. plugins)
run-shell 'tmux set-environment -g PATH "$HOME/.local/share/mise/shims:$PATH"'


# I like status bar at the top with window list centered
set -g status-position top
set -g status-justify centre
set -g status-style fg=black,bg=cyan
# set -g window-status-style fg=colour238,bg=cyan
set -g window-status-current-style fg=black,bg=cyan,bold
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-separator ""
set-option -g pane-active-border-style fg=cyan
# set-option -g pane-border-style fg=colour242
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold],}#P: #T "

set-option -g focus-events on
set -g default-terminal "tmux-256color"
set -g allow-passthrough on # Let image protocols (kitty/iterm2) reach the terminal, e.g. for presenterm
set-option -sa terminal-features ',alacritty:RGB' # Ensure nvim colors look right inside tmux
set -g status-keys "emacs"


set -g status-left-length 40
set -g status-left "[ #{s|/_worktrees/|/|;s|/_wt/|/|;=34:session_name} ]"
# set -g status-right "▶ #{=50:pane_title} │ ◷ %b %d %l:%M%p "
set -g status-right "%b %d %l:%M %p "
# set -g status-right-length 50

bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key - select-layout even-horizontal


bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1
bind -n M-Left resize-pane -L 10
bind -n M-Right resize-pane -R 10
bind -n M-Down resize-pane -D 5
bind -n M-Up resize-pane -U 5


bind-key f display-popup
bind-key a display-popup -E -w 100% -h 100% ccmux


set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# Do not prompt to kill panes
bind-key x kill-pane


bind-key b break-pane -d


# Open scrollback in $EDITOR
bind-key e capture-pane -S -32768 \; save-buffer /tmp/tmux-buffer \; delete-buffer \; send-keys "$EDITOR +$ /tmp/tmux-buffer" Enter


# Set up copy/paste
# following https://stackoverflow.com/a/47491869
set-window-option -g mode-keys vi

# macOS-specific copy-paste settings
if-shell "uname | grep -q Darwin" {
    set -g default-command "reattach-to-user-namespace -l ${SHELL}"
    bind-key -T copy-mode-vi 'v' send-keys -X begin-selection 
    bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
}

# Linux-specific copy-paste settings
if-shell "uname | grep -q Linux" {
    set -g default-command '${SHELL}'
    bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
    bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
}



# vim / tmux navigator
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l






# https://superuser.com/a/1809494
set -s escape-time 5  # ~5-100. https://superuser.com/a/1809494/224906


# Plugins (managed by tpack)
set -g @plugin 'sainnhe/tmux-fzf'



# Set up sesh


bind-key s run-shell "sesh connect \"$(
  sesh list -t --icons | fzf --tmux 100%,100% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh-preview {}'
)\""

bind-key S choose-tree -Zs


bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session


# ── tmux-fuzzback: fuzzy-search the scrollback buffer ──────────────
# Bound to prefix + / so prefix + ? keeps its default (list-keys).
set -g @plugin 'roosta/tmux-fuzzback'
set -g @fuzzback-bind /
set -g @fuzzback-popup 1
set -g @fuzzback-popup-size '80%'
set -g @fuzzback-finder-layout 'default'   # prompt at the bottom; newest (bottom-of-scrollback) line selected right above it

# ctrl-y inside the finder copies the matched line to the system clipboard.
# Split by OS to match how you handle copy/paste elsewhere in this file.
if-shell "uname | grep -q Darwin" {
    set -g @fuzzback-finder-bind 'ctrl-y:execute-silent(echo -n {3..} | pbcopy)+abort'
}
if-shell "uname | grep -q Linux" {
    set -g @fuzzback-finder-bind 'ctrl-y:execute-silent(echo -n {3..} | xsel -ib)+abort'
}


# Initialize tpack (keep at the very bottom of tmux.conf)
run '~/.local/share/mise/shims/tpack init'
