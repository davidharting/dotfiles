[tools]
node = "26.5.0"
"npm:bashunit" = "0.41.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"

[tasks.test]
description = "Run the bashunit test suite"
run = "bashunit tests"

# `shfmt -f .` recursively finds shell files by extension and shebang, so it
# picks up the extensionless scripts too. fzf-tmux is vendored from fzf and
# intentionally kept close to upstream, so exclude it from both tools.
[tasks.lint]
description = "Lint shell scripts with ShellCheck"
run = "shfmt -f . | grep -v scripts/fzf-tmux | xargs shellcheck"

[tasks."format-check"]
description = "Check shell script formatting with shfmt"
run = "shfmt -f . | grep -v scripts/fzf-tmux | xargs shfmt -d -i 2 -ci -bn"

[tasks.format]
description = "Format shell scripts with shfmt"
run = "shfmt -f . | grep -v scripts/fzf-tmux | xargs shfmt -w -i 2 -ci -bn"

[tasks.check]
description = "Run tests, linting, and formatting checks"
depends = ["test", "lint", "format-check"]
