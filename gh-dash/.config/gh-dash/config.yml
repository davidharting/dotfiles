prSections:
    - title: My Render PRs
      filters: is:open author:@me archived:false org:renderinc org:render-oss org:render-examples org:render-interviews sort:updated-desc
    - title: Assigned to Me
      filters: is:open assignee:@me archived:false org:renderinc org:render-oss org:render-examples org:render-interviews sort:updated-desc
    - title: Involved
      filters: is:open involves:@me -author:@me archived:false org:renderinc org:render-oss org:render-examples org:render-interviews sort:updated-desc
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: is:all
    - title: Unread
      filters: is:unread
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.45
        height: 0.6
        position: auto
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            labels:
                width: 22
                hidden: true
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
    prs:
        - key: ctrl+w
          name: worktree (wtt)
          command: >
            wtt --repo "$(basename {{.RepoName}})" pr:{{.PrNumber}}
repoPaths: {}
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
